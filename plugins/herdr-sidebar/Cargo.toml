[package]
name = "herdr-sidebar"
version = "0.7.0"
edition = "2024"
description = "VS Code-style sidebar for herdr: file explorer + source control in one pane"
license = "MIT"

[lib]
name = "herdr_sidebar"
path = "src/lib.rs"

[[bin]]
name = "herdr-sidebar"
path = "src/main.rs"

# Windowless sidecar for [[events]] hooks: GUI subsystem on Windows (never owns a
# console) talking to herdr's socket API directly — spawning console tools from a
# hook flashes a Windows Terminal window per process on Windows 11.
[[bin]]
name = "herdr-sidebar-ensure"
path = "src/bin/ensure.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust engine (regex-fancy): no oniguruma C build on Windows; bundled
# grammar/theme dumps for the file-preview syntax highlighting.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-themes",
    "dump-load",
    "regex-fancy",
] }
# bat's extended grammar set (TypeScript, TOML, Dockerfile, …) — syntect's
# own defaults miss those.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Native folder picker for "Change Folder" (Windows IFileDialog); other
# platforms keep the typed-path prompt. macOS deliberately does NOT use rfd:
# its Cocoa backend panics when a dialog is opened off the main thread in a
# process with no running NSApplication, which is every terminal TUI — see
# `actions::pick_folder`, which shells out to osascript there instead.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
